<div class="min-h-screen bg-gray-50 flex flex-col">

  <!-- Header -->
  <div class="bg-gradient-to-r from-violet-700 to-indigo-700 text-white px-5 pt-12 pb-5">
    <div class="flex items-center gap-3">
      <a routerLink="/" class="p-1 -ml-1 rounded-xl active:bg-white/20 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
        </svg>
      </a>
      <div>
        <h1 class="text-lg font-bold">Assistente de Saúde</h1>
        <p class="text-violet-200 text-xs">Powered by Gemini AI</p>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4" style="padding-bottom: 90px">

    @for (msg of mensagens; track $index) {

      <!-- Mensagem do assistente -->
      @if (msg.role === 'model') {
        <div class="flex items-start gap-2.5 max-w-[85%]">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center flex-shrink-0">
            <span class="text-white text-sm">🤖</span>
          </div>
          <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-gray-100">
            <p class="text-sm text-gray-800 leading-relaxed whitespace-pre-wrap">{{ msg.texto }}</p>
          </div>
        </div>
      }

      <!-- Mensagem do usuário -->
      @if (msg.role === 'user') {
        <div class="flex justify-end">
          <div class="bg-violet-600 text-white rounded-2xl rounded-tr-sm px-4 py-3 max-w-[80%] shadow-sm">
            <p class="text-sm leading-relaxed">{{ msg.texto }}</p>
          </div>
        </div>
      }

    }

    <!-- Digitando... -->
    @if (carregando) {
      <div class="flex items-start gap-2.5">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center flex-shrink-0">
          <span class="text-white text-sm">🤖</span>
        </div>
        <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm border border-gray-100">
          <div class="flex gap-1.5 items-center h-5">
            <span class="w-2 h-2 bg-violet-400 rounded-full animate-bounce" style="animation-delay:0ms"></span>
            <span class="w-2 h-2 bg-violet-400 rounded-full animate-bounce" style="animation-delay:150ms"></span>
            <span class="w-2 h-2 bg-violet-400 rounded-full animate-bounce" style="animation-delay:300ms"></span>
          </div>
        </div>
      </div>
    }

    <div #chatFim></div>
  </div>

  <!-- Input fixo no rodapé -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-3">
    <div class="flex gap-2 items-end max-w-lg mx-auto">
      <textarea [(ngModel)]="inputTexto"
        (keydown.enter)="$event.preventDefault(); enviar()"
        placeholder="Pergunte sobre saúde, exames, UBS..."
        rows="1"
        class="flex-1 border border-gray-200 bg-gray-50 rounded-xl px-4 py-3 text-sm outline-none focus:border-violet-400 focus:bg-white transition resize-none leading-snug max-h-28 overflow-y-auto"></textarea>
      <button (click)="enviar()" [disabled]="carregando || !inputTexto.trim()"
        class="w-11 h-11 bg-violet-600 text-white rounded-xl flex items-center justify-center active:scale-95 transition disabled:opacity-40 flex-shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"/>
        </svg>
      </button>
    </div>
  </div>

</div>
