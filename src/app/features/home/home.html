<div class="min-h-screen bg-gray-50 flex flex-col">

  <!-- Header azul -->
  <div class="bg-blue-700 text-white px-5 pt-10 pb-6">
    <div class="flex justify-between items-start mb-1">
      <div>
        <h1 class="text-xl font-bold">E aí, bora se cuidar hoje?</h1>
        <p class="text-blue-200 text-sm mt-1">Confira suas orientações e acompanhe sua saúde.</p>
      </div>
      <div class="flex gap-2 mt-1">
        <a routerLink="/perfil" class="text-blue-200 text-xs border border-blue-400 px-2 py-1 rounded-lg">👤 Perfil</a>
        <button (click)="logout()" class="text-blue-200 text-xs border border-blue-400 px-2 py-1 rounded-lg">Sair</button>
      </div>
    </div>

    <!-- Badge de pontos -->
    <div class="inline-flex items-center gap-2 bg-yellow-400 text-yellow-900 font-semibold text-sm px-4 py-1 rounded-full mt-3">
      ⭐ {{ pontos }} pontos acumulados
    </div>
  </div>

  <!-- Banner lembrete -->
  <div class="mx-4 mt-4 bg-yellow-50 border border-yellow-300 rounded-2xl px-4 py-3 flex items-center gap-2 text-sm text-yellow-800 font-medium">
    🔔 Lembrete: Você já verificou como está sua pressão?
  </div>

  <!-- Grid 3x3 -->
  <div class="grid grid-cols-3 gap-3 px-4 mt-4 pb-8">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      class="flex flex-col items-center justify-center bg-white rounded-2xl py-4 px-2 shadow-sm border-2 active:scale-95 transition text-center"
      [ngClass]="item.destaque ? 'border-green-400' : 'border-gray-100'">
      <span class="text-2xl mb-2">{{ item.icon }}</span>
      <span class="text-xs font-semibold text-gray-700 leading-tight">{{ item.label }}</span>
    </a>
  </div>

</div>
