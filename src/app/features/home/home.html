<div class="min-h-screen bg-gray-50 flex flex-col">

  <!-- Header -->
  <div class="bg-green-700 text-white px-5 pt-12 pb-6">
    <div class="flex justify-between items-start mb-3">
      <div class="flex items-center gap-2.5">
        <img src="logo.svg" alt="Previne Homem" class="w-9 h-9 rounded-xl" />
        <div>
          <p class="text-green-200 text-sm font-medium">Olá{{ nomeUsuario ? ', ' + nomeUsuario : '' }}</p>
          <h1 class="text-xl font-bold mt-0.5">Bora se cuidar hoje?</h1>
        </div>
      </div>
      <div class="flex gap-2 mt-1">
        <a routerLink="/perfil" class="flex items-center gap-1.5 text-green-200 text-xs border border-green-500 px-2.5 py-1.5 rounded-xl">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
          </svg>
          Perfil
        </a>
        <button (click)="logout()" class="flex items-center gap-1.5 text-green-200 text-xs border border-green-500 px-2.5 py-1.5 rounded-xl">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25"/>
          </svg>
          Sair
        </button>
      </div>
    </div>

    <!-- Badge de pontos -->
    <div class="inline-flex items-center gap-2 bg-yellow-400 text-yellow-900 font-semibold text-sm px-4 py-1.5 rounded-full">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z" clip-rule="evenodd"/>
      </svg>
      {{ pontos }} pontos
    </div>
  </div>

  <!-- Banner lembrete -->
  <div class="mx-4 mt-4 bg-amber-50 border border-amber-200 rounded-2xl px-4 py-3 flex items-center gap-3 text-sm text-amber-800 font-medium">
    <svg class="w-5 h-5 text-amber-500 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
    </svg>
    Lembrete: Você já verificou como está sua pressão?
  </div>

  <!-- Grid de menu -->
  <div class="grid grid-cols-3 gap-3 px-4 mt-4 pb-8">
    @for (item of menuItems; track item.route) {
      <a [routerLink]="item.route"
        class="flex flex-col items-center justify-center bg-white rounded-2xl py-4 px-2 shadow-sm border active:scale-95 transition text-center"
        [class.border-green-300]="item.destaque"
        [class.border-gray-100]="!item.destaque">
        <div class="w-11 h-11 rounded-xl flex items-center justify-center mb-2" [ngClass]="item.bg">
          <svg class="w-6 h-6" [ngClass]="item.color" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            @for (p of item.svgPaths; track p) {
              <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="p"/>
            }
          </svg>
        </div>
        <span class="text-xs font-semibold text-gray-700 leading-tight">{{ item.label }}</span>
      </a>
    }
  </div>

</div>
