<div class="min-h-screen bg-gray-50 flex flex-col">

  <!-- Header -->
  <div class="bg-blue-700 text-white px-5 pt-12 pb-6">
    <div class="flex items-center gap-3 mb-1">
      <a routerLink="/" class="p-1 -ml-1 rounded-xl active:bg-blue-600 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
        </svg>
      </a>
      <h1 class="text-xl font-bold">Minha UBS</h1>
    </div>
    <p class="text-blue-200 text-sm">Seu principal ponto de cuidado</p>
  </div>

  <div class="px-4 py-5 space-y-4">

    <!-- Card da UBS -->
    <div class="bg-white rounded-2xl p-4 shadow-sm">

      <h2 class="text-lg font-bold text-gray-800 mb-1">{{ ubsNome }}</h2>
      <div class="flex items-center gap-1.5 text-sm text-gray-500 mb-3">
        <svg class="w-4 h-4 text-blue-500 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/>
        </svg>
        {{ ubsEndereco }}
      </div>

      <!-- Badges de serviços -->
      <div class="flex flex-wrap gap-2 mb-4">
        @for (s of servicos; track s) {
          <span class="text-xs font-semibold px-3 py-1 rounded-full"
            [class.bg-green-100]="s === 'Vacinação'"
            [class.text-green-700]="s === 'Vacinação'"
            [class.bg-blue-100]="s === 'Exames'"
            [class.text-blue-700]="s === 'Exames'"
            [class.bg-gray-100]="s !== 'Vacinação' && s !== 'Exames'"
            [class.text-gray-600]="s !== 'Vacinação' && s !== 'Exames'">
            {{ s }}
          </span>
        }
      </div>

      <!-- Mapa placeholder -->
      <div class="relative bg-blue-50 rounded-2xl h-32 flex items-center justify-center mb-4 overflow-hidden border border-blue-100">
        <svg class="w-12 h-12 text-blue-300" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/>
        </svg>
        <button (click)="verNoMapa()"
          class="absolute bottom-2 right-2 bg-white text-gray-700 text-xs font-semibold px-3 py-1.5 rounded-xl shadow-sm border border-gray-100">
          Ver no mapa
        </button>
      </div>

      <!-- Agendar -->
      <button (click)="agendarConsulta()"
        class="w-full bg-blue-700 text-white py-4 rounded-2xl font-semibold active:scale-95 transition shadow-md">
        Agendar consulta
      </button>
    </div>

    <!-- Por que ir à UBS -->
    <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4">
      <h3 class="font-bold text-blue-800 mb-2">Por que ir à UBS?</h3>
      <p class="text-sm text-blue-700 leading-relaxed">
        A UBS oferece consultas gratuitas, exames preventivos e acompanhamento contínuo da sua saúde — sem custo.
      </p>
    </div>

  </div>
</div>
