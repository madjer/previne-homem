<div class="min-h-screen bg-white flex flex-col">

  <!-- Header -->
  <div class="bg-blue-700 text-white px-5 pt-10 pb-6">
    <h1 class="text-xl font-bold">Meu Resultado</h1>
    <p class="text-blue-200 text-sm mt-1">Orientações personalizadas para você</p>
  </div>

  <div class="flex-1 px-5 py-6 space-y-4">

    <p class="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Riscos Identificados</p>

    <!-- Cards de risco -->
    <div *ngFor="let risco of riscos"
      class="rounded-2xl p-4 border-l-4"
      [ngClass]="{
        'bg-red-50 border-red-500':    risco.nivel === 'red',
        'bg-yellow-50 border-yellow-500': risco.nivel === 'yellow',
        'bg-green-50 border-green-500':  risco.nivel === 'green'
      }">

      <div class="flex items-center gap-2 mb-1">
        <span class="w-3 h-3 rounded-full inline-block"
          [ngClass]="{
            'bg-red-500':    risco.nivel === 'red',
            'bg-yellow-500': risco.nivel === 'yellow',
            'bg-green-500':  risco.nivel === 'green'
          }"></span>
        <span class="font-bold text-gray-800">{{ risco.titulo }}</span>
      </div>

      <p class="text-sm text-gray-600 mb-3 ml-5">{{ risco.descricao }}</p>

      <span class="ml-5 inline-block text-xs font-semibold px-3 py-1 rounded-full"
        [ngClass]="{
          'bg-red-200 text-red-800':      risco.nivel === 'red',
          'bg-yellow-200 text-yellow-800': risco.nivel === 'yellow',
          'bg-green-200 text-green-800':   risco.nivel === 'green'
        }">
        {{ risco.nivel === 'red' ? '⚠ ' : risco.nivel === 'green' ? '✓ ' : '' }}{{ risco.badge }}
      </span>
    </div>

  </div>

  <!-- Botões -->
  <div class="px-5 pb-8 space-y-3">
    <a routerLink="/minha-saude"
      class="w-full bg-blue-700 text-white py-4 rounded-2xl font-semibold text-center block active:scale-95 transition shadow-md">
      Ver orientações completas
    </a>
    <a routerLink="/minha-ubs"
      class="w-full border-2 border-blue-700 text-blue-700 py-4 rounded-2xl font-semibold text-center block active:scale-95 transition">
      Agendar na UBS
    </a>
  </div>

</div>
