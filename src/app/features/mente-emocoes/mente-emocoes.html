<div class="min-h-screen bg-pink-50 flex flex-col">

  <!-- Header -->
  <div class="bg-rose-700 text-white px-5 pt-10 pb-6">
    <div class="flex items-center gap-3 mb-1">
      <a routerLink="/" class="text-white text-lg">←</a>
      <h1 class="text-xl font-bold">Saúde Mental</h1>
    </div>
    <p class="text-rose-200 text-sm">Como você está se sentindo?</p>
  </div>

  <div class="px-4 py-5 space-y-5">

    <!-- Seletor de humor -->
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h2 class="font-bold text-gray-800 mb-4">Humor de hoje</h2>
      <div class="flex justify-between items-end">
        <div *ngFor="let op of opcoes"
          (click)="selecionar(op.valor)"
          class="flex flex-col items-center gap-1 cursor-pointer">
          <div class="text-3xl transition-transform"
            [ngClass]="humorSelecionado === op.valor ? 'scale-125' : 'opacity-50'">
            {{ op.emoji }}
          </div>
          <span class="text-xs font-medium"
            [ngClass]="humorSelecionado === op.valor ? 'text-rose-700 font-bold' : 'text-gray-400'">
            {{ op.label }}
          </span>
        </div>
      </div>
    </div>

    <!-- Conteúdo -->
    <div>
      <h2 class="font-bold text-gray-800 mb-3">Conteúdo para você</h2>
      <div class="space-y-3">
        <div *ngFor="let c of conteudos"
          class="bg-white rounded-2xl p-4 shadow-sm cursor-pointer active:scale-95 transition">
          <span class="inline-block bg-rose-100 text-rose-700 text-xs font-semibold px-3 py-1 rounded-full mb-2">
            {{ c.tag }}
          </span>
          <p class="font-semibold text-gray-800 text-sm">{{ c.titulo }}</p>
          <p class="text-xs text-gray-400 mt-1">{{ c.tempo }}</p>
        </div>
      </div>
    </div>

    <!-- Botão UBS -->
    <button routerLink="/minha-ubs"
      class="w-full bg-rose-700 text-white py-4 rounded-2xl font-semibold active:scale-95 transition shadow-md">
      Falar com a UBS
    </button>

  </div>
</div>
