<div class="min-h-screen bg-gradient-to-b from-blue-700 to-blue-500 flex flex-col items-center">
    <!-- Mascote -->
    <img src="mascote.png" class="w-52 ml-24 absolute" />

    <!-- Card Login -->
    <div class="w-[calc(100%-32px)] bg-white rounded-3xl p-6 mt-52 shadow-xl">

        <h2 class="text-2xl font-bold text-blue-900 mb-6">
            Login
        </h2>

        <form (ngSubmit)="loginWithEmailPassword()">
            <!-- Email -->
            <div class="mb-4">
                <label class="text-sm text-gray-600">E-mail</label>
                <div class="flex items-center border rounded-xl px-3 mt-1">
                    <span class="text-blue-600 mr-2">📧</span>
                    <input type="email" name="email" [(ngModel)]="email" placeholder="Digite seu e-mail"
                        class="w-full py-3 outline-none" autocomplete="email" />
                </div>
            </div>

            <!-- Senha -->
            <div class="mb-2">
                <label class="text-sm text-gray-600">Senha</label>
                <div class="flex items-center border rounded-xl px-3 mt-1">
                    <span class="text-blue-600 mr-2">🔒</span>
                    <input type="password" name="password" [(ngModel)]="password" placeholder="Digite sua senha"
                        class="w-full py-3 outline-none" autocomplete="current-password" />
                </div>
            </div>

            <!-- Esqueci senha -->
            <div class="text-right mb-6">
                <a class="text-sm text-blue-600 font-medium">
                    Esqueceu a senha?
                </a>
            </div>

            <!-- Botão entrar -->
            <button type="submit" [disabled]="isLoading"
                class="w-full bg-blue-600 text-white py-4 rounded-xl font-semibold shadow-md active:scale-95 transition">
                Entrar
            </button>

            <p *ngIf="errorMessage" class="text-sm text-red-600 mt-3">{{ errorMessage }}</p>
        </form>

        <button (click)="loginGoogle()"
            class="w-full mt-10 flex items-center justify-center gap-3 bg-white text-blue-900 px-6 py-3 rounded-xl shadow-md active:scale-95 transition mb-20">
            <img src="google.svg" class="w-5 h-5" />
            <span>Entrar com Google</span>
        </button>
        <!-- Divider -->
        <div class="flex items-center my-6">
            <div class="flex-1 h-px bg-gray-200"></div>
            <span class="px-3 text-gray-400 text-sm">ou</span>
            <div class="flex-1 h-px bg-gray-200"></div>
        </div>

        <!-- Criar conta -->
        <button type="button" (click)="registerWithEmailPassword()" [disabled]="isLoading"
            class="w-full bg-red-500 text-white py-4 rounded-xl font-semibold shadow-md active:scale-95 transition">
            Criar Conta
        </button>

    </div>

</div>
