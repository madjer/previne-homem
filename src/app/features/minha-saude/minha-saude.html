<div class="min-h-screen bg-gray-50 flex flex-col">

  <!-- Header -->
  <div class="bg-blue-500 text-white px-5 pt-12 pb-6">
    <div class="flex items-center gap-3 mb-1">
      <a routerLink="/" class="p-1 -ml-1 rounded-xl active:bg-blue-500 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/>
        </svg>
      </a>
      <h1 class="text-xl font-bold">Minha Saúde</h1>
    </div>
    <p class="text-blue-100 text-sm">Monitore seus dados de saúde</p>
  </div>

  <div class="px-4 py-5 space-y-5">

    <!-- Grid de métricas -->
    <div class="grid grid-cols-2 gap-3">
      @for (m of metricas; track m.label) {
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <p class="text-xs text-gray-500 font-medium mb-1">{{ m.label }}</p>
          <p class="text-3xl font-bold text-gray-800">{{ m.valor }}</p>
          <p class="text-xs text-gray-400 mt-0.5">{{ m.unidade }} · {{ m.detalhe }}</p>
          <div class="mt-2.5 h-1.5 rounded-full w-full"
            [class.bg-red-400]="m.cor === 'red'"
            [class.bg-blue-300]="m.cor === 'green'"
            [class.bg-yellow-400]="m.cor === 'yellow'"></div>
        </div>
      }
    </div>

    <!-- Histórico recente -->
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
      <h2 class="font-bold text-gray-800 mb-3">Histórico recente</h2>
      @for (item of historico; track item.texto) {
        <div class="flex items-start gap-3 mb-3 last:mb-0">
          <span class="w-2.5 h-2.5 rounded-full mt-1.5 flex-shrink-0"
            [class.bg-blue-400]="item.cor === 'green'"
            [class.bg-yellow-500]="item.cor !== 'green'"></span>
          <div>
            <p class="text-sm text-gray-700 font-medium">{{ item.texto }}</p>
            <p class="text-xs text-gray-400 mt-0.5">{{ item.data }}</p>
          </div>
        </div>
      }
    </div>

  </div>

</div>
