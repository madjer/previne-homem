<div class="min-h-screen bg-gray-50 flex flex-col">

  <!-- Header verde -->
  <div class="bg-green-700 text-white px-5 pt-10 pb-6">
    <div class="flex items-center gap-3 mb-1">
      <a routerLink="/" class="text-white text-lg">←</a>
      <h1 class="text-xl font-bold">Minha Saúde</h1>
    </div>
    <p class="text-green-200 text-sm">Monitore seus dados de saúde</p>
  </div>

  <div class="px-4 py-5 space-y-5">

    <!-- Grid de métricas -->
    <div class="grid grid-cols-2 gap-3">
      <div *ngFor="let m of metricas"
        class="bg-white rounded-2xl p-4 shadow-sm">
        <p class="text-xs text-gray-500 font-medium mb-1">{{ m.label }}</p>
        <p class="text-3xl font-bold text-gray-800">
          {{ m.valor }}<span *ngIf="m.unidade" class="text-sm font-normal text-gray-500">/{{ m.unidade.split('/')[1] || '' }}</span>
        </p>
        <p *ngIf="m.unidade.includes('/')" class="text-xs text-gray-400">{{ m.unidade }} · {{ m.detalhe }}</p>
        <p *ngIf="!m.unidade.includes('/')" class="text-xs text-gray-400">{{ m.unidade }} · {{ m.detalhe }}</p>
        <!-- Barra de indicador -->
        <div class="mt-2 h-1.5 rounded-full w-full"
          [ngClass]="{
            'bg-red-400':    m.cor === 'red',
            'bg-green-400':  m.cor === 'green',
            'bg-yellow-400': m.cor === 'yellow'
          }"></div>
      </div>
    </div>

    <!-- Histórico recente -->
    <div class="bg-white rounded-2xl p-4 shadow-sm">
      <h2 class="font-bold text-gray-800 mb-3">Histórico recente</h2>
      <div *ngFor="let item of historico" class="flex items-start gap-3 mb-3 last:mb-0">
        <span class="w-2.5 h-2.5 rounded-full mt-1 flex-shrink-0"
          [ngClass]="item.cor === 'green' ? 'bg-green-500' : 'bg-yellow-500'"></span>
        <div>
          <p class="text-sm text-gray-700 font-medium">{{ item.texto }}</p>
          <p class="text-xs text-gray-400">{{ item.data }}</p>
        </div>
      </div>
    </div>

  </div>

</div>
