<div class="min-h-screen flex flex-col items-center justify-center px-6 py-10"
  style="background: linear-gradient(160deg, #0c1a2e 0%, #1e3a5f 60%, #1565c0 100%)">

  <!-- Logo + título -->
  <div class="flex flex-col items-center mb-10">
    <div class="w-24 h-24 rounded-3xl bg-white/10 backdrop-blur flex items-center justify-center mb-5 shadow-2xl border border-white/20">
      <img src="logo.svg" alt="Previne Homem" class="w-14 h-14 drop-shadow-lg" />
    </div>
    <h1 class="text-3xl font-bold text-white tracking-tight">Previne Homem</h1>
    <p class="text-blue-300 text-sm mt-1">Cuide da sua saúde com inteligência</p>
  </div>

  <!-- Botões -->
  <div class="w-full max-w-xs flex flex-col gap-3">
    <a routerLink="/login" [queryParams]="{ modo: 'login' }"
      class="w-full bg-white text-blue-900 text-center py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition text-sm">
      Acessar minha conta Previne
    </a>
    <a routerLink="/login" [queryParams]="{ modo: 'cadastro' }"
      class="w-full border-2 border-white/40 text-white text-center py-4 rounded-2xl font-semibold active:scale-95 transition backdrop-blur text-sm bg-white/10">
      Primeiro acesso? Crie sua conta
    </a>
  </div>

  <!-- Segurança -->
  <div class="flex items-center gap-2 mt-8 text-xs text-blue-300/80">
    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/>
    </svg>
    Seus dados estão protegidos. Criptografia de ponta a ponta.
  </div>

</div>
