<div class="min-h-screen bg-gray-900 flex flex-col items-center justify-center px-6 py-10">

  <div class="w-full bg-white rounded-3xl p-8 shadow-xl">

    <!-- Logo -->
    <div class="flex justify-center mb-5">
      <img src="logo.svg" alt="Previne Homem" class="w-20 h-20 drop-shadow-md" />
    </div>

    <!-- Título -->
    <h2 class="text-2xl font-bold text-green-900 text-center mb-1">Previne Homem</h2>
    <p class="text-gray-500 text-sm text-center mb-8">Como deseja continuar?</p>

    <!-- Entrar -->
    <a routerLink="/login" [queryParams]="{ modo: 'login' }"
      class="w-full bg-green-700 text-white text-center py-4 rounded-2xl font-semibold shadow-md active:scale-95 transition mb-4 flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15"/>
      </svg>
      Entrar na minha conta
    </a>

    <!-- Criar conta -->
    <a routerLink="/login" [queryParams]="{ modo: 'cadastro' }"
      class="w-full border-2 border-green-700 text-green-700 text-center py-4 rounded-2xl font-semibold active:scale-95 transition flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z"/>
      </svg>
      Criar nova conta
    </a>

    <!-- Segurança -->
    <div class="flex items-center justify-center gap-2 mt-6 text-xs text-gray-400">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/>
      </svg>
      Seus dados são protegidos
    </div>

  </div>
</div>
